t-tickets/football/manchester-united-tickets\"\u003e\u003cu\u003e \u003c/u\u003e\u003cu\u003e\u003cstrong\u003eManchester United\u003c/strong\u003e\u003c/u\u003e\u003c/a\u003e, giving fans unrivalled access to VIP Matchday Experiences.\u003c/p\u003e\r\n\u003cp\u003eFrom legendary stadiums such as \u003cstrong\u003eAnfield\u003c/strong\u003e, the \u003cstrong\u003eEtihad Stadium\u003c/strong\u003e, and \u003cstrong\u003eOld Trafford\u003c/strong\u003e, to the world-class \u003cstrong\u003eEmirates Stadium\u003c/strong\u003e, supporters can enjoy luxury hospitality experiences that go far beyond 90 minutes of football. Packages include premium seating with the best views, fine dining, and exclusive access to lounges where unforgettable memories are made.\u003c/p\u003e\r\n\u003cp\u003eWhether it’s the intensity of a \u003ca href=\"https://www.seatunique.com/sport-tickets/football/competitions/premier-league-tickets\"\u003ePremier League\u003c/a\u003e title clash, the magic of a knockout night under the lights in the\u003ca href=\"https://www.seatunique.com/sport-tickets/football/champions-league-tickets\"\u003e\u003cu\u003e \u003c/u\u003e\u003cu\u003e\u003cstrong\u003eChampions League\u003c/strong\u003e\u003c/u\u003e\u003c/a\u003e, or the tradition and unpredictability of the\u003ca href=\"https://www.seatunique.com/sport-tickets/football/fa-cup-tickets\"\u003e\u003cu\u003e \u003c/u\u003e\u003cu\u003e\u003cstrong\u003eFA Cup\u003c/strong\u003e\u003c/u\u003e\u003c/a\u003e, Seat Unique ensures you’ll witness history in style.\u003c/p\u003e\r\n\u003cp\u003eSo, whether you’re treating clients, celebrating with family, or looking for the ultimate gift for a football fan, explore our full range of football hospitality tickets and secure your premium matchday experience today.\u003c/p\u003e33:T1a37,\u003ch1 style=\"\r\n    font-weight: 900;\r\n    letter-spacing: 0.5px;\r\n    line-height: normal;\r\n    width: 100%;\r\n    margin: 15px 0px;\r\n    font-size: 36px;\r\n\"\u003eSeat Unique Giveaway\u003c/h1\u003e\r\n\u003ch2\u003e\u003cstrong\u003eTerms and Conditions of Entry\u003c/strong\u003e\u003c/h2\u003e\r\n\r\n\r\n\u003cp\u003e1. The Download the app giveaway (the Giveaway) is open to all UK residents aged 18 years or over, except employees of the Promoters, their families, agents or any third party directly associated with administration of the Giveaway.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e2. The Giveaway is free to enter and no purchase is necessary.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e3. By downloading the Seat Unique app and creating or logging in to your account through the app eligible participants will be automatically entered into the prize draw. You can opt out of the prize draw by emailing \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The opening date for entries is 10.00am on 8th January 2026. The closing date to participate is 10.00am GMT on 19th February 2026. Entries received after this time will not be accepted. \u003c/p\u003e\r\n\r\n\u003cp\u003e5. The Promoter accepts no responsibility for entries not successfully completed due to a technical fault, technical malfunction, computer hardware or software failure, satellite, network or server failure of any kind.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e6. One winner will be chosen by random selection on the 20th February (\"Draw Date\").\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e7. The winner will receive two tickets to a premier league match and will be offered some fixture options to choose from at Seat Unique’s discretion. Conditions apply.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e8. The winner will be notified by Seat Unique by email (using the email address associated with the account they logged in with) before 23rd February and must respond to claim their prize. If a winner does not respond to Seat Unique within 7 days of being notified by Seat Unique, then the winner's prize will be forfeited and Seat Unique will be entitled to select another winner in accordance with the process described above.\u003c/p\u003e\r\n\r\n\u003cp\u003e9. The Promoter reserves the right to verify the winner’s identity and eligibility. \u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e10.  The prize for the winner is non-exchangeable, non-transferable and no cash alternative is offered. \u003c/p\u003e\r\n\r\n\u003cp\u003e11.  The Promoter reserves the right to replace the prize with an alternative prize of equal or higher value if circumstances beyond the Promoter’s control makes it necessary to do so. \u003c/p\u003e\r\n\r\n\u003cp\u003e12.  The decision of the Promoter regarding any aspect of the prize draw is final and binding and no correspondence will be entered into about it. \u003c/p\u003e\r\n\u003cp\u003e13.  No third-party or bulk entries are allowed. If the Promoter suspects any entrant of attempting to manipulate the entry process (e.g., using multiple email accounts or other unfair methods), that entrant will be disqualified, and their entry will be void.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e14.  For Prizes involving Match Tickets\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eTickets will be issued via e-ticket prior to the fixture. To use a ticket, the winner will be required to ensure they have the required digital device to download and show the ticket upon entry. \u003c/p\u003e\r\n\u003cp\u003eEach match ticket issued by a Club is subject to their terms and conditions of entry.  Acceptance of the prize constitutes acceptance of the club’s terms and conditions of entry. The ticket shall remain at all times the property of the club.\u003c/p\u003e\r\n\u003cp\u003eFixture dates are subject to change.\u003c/p\u003e\r\n\u003cp\u003eThe prize does not include travel arrangements, including insurance, the cost of transfers to and from airports or stations, food and drink (other than expressly stated as being included in the ticket), spending money, tax or personal expenses. Any other costs incurred in addition to those set out above and that are incidental to the fulfilment of the prize are the responsibility of the winner.\u003c/p\u003e\r\n\u003cp\u003eWe will not be held responsible for the winner(s) and/or companion(s) not taking advantage of the prizes due to health or any other reason. If you have any additional requirements to accommodate a disability we ask that you make this clear when you claim the prize so that the Club can consult with the winner in advance to seek to make such reasonable adjustments as are practical and within the club’s control, based on circumstances, to ensure the winner can enjoy the prize to the fullest extent.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e15.  The Promoter must either publish or make available information that indicates that a valid award took place. To comply with this obligation Seat Unique will send the surname and county of major prize winners and, if applicable copies of their winning entries, to anyone who emails \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e or writes to [Seat Unique, 8 Greencoat Place, London SW1P 1PL] (enclosing a self-addressed envelope) within one month after the closing date stated in condition 4. If you object to any or all of your surname, county and winning entry being published or made available, please contact Seat Unique [Seat Unique, 8 Greencoat Place, London SW1P 1PL]. In such circumstances, Seat Unique must still provide the information and winning entry to the Advertising Standards Authority on request.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e16.  Participants are deemed to have accepted and agreed to be bound by these terms and conditions upon entry. The Promoter reserves the right to refuse entry, or refuse to award the prize to anyone in breach of these terms and conditions. \u003c/p\u003e\r\n\r\n\r\n\r\n\u003cp\u003e17.  The Promoter reserves the right to hold void, cancel, suspend, or amend the promotion where it becomes necessary to do so.\u003c/p\u003e\r\n\r\n\u003cp\u003e18.  Insofar as is permitted by law, the Promoter, its agents or distributors will not in any circumstances be responsible or liable to compensate the winner or accept any liability for any loss, damage, personal injury or death occurring as a result of taking up the prize except where it is caused by the negligence of the Promoter, its agents or distributors or that of their employees. Your statutory rights are not affected.\u003c/p\u003e\r\n\r\n\r\n\u003cp\u003e19.  Personal data supplied during the course of this promotion will be collected and processed by Seat Unique in order to administer the competition and as otherwise as set out in Seat Unique’s \u003ca href=\"/privacy-policy/\"\u003ePrivacy Policy\u003c/a\u003e. See also condition 15 with regard to the announcement of winners. \u003c/p\u003e\r\n\r\n\u003cp\u003e20.  These terms and conditions and this promotion are governed by English law. If any entrants to this promotion wish to take court proceedings, then they must do this within the courts in the United Kingdom. \u003c/p\u003e\r\n\r\n\u003cp\u003e21.  The promoter of this prize draw is RMS Events Ltd (t/a Seat Unique) with registered address at 8 Greencoat Place, London SW1P 1PL (the \u003cb\u003ePromoter\u003c/b\u003e).\u003c/p\u003e34:T7cf7,\r\n\u003ch1\u003ePrivacy Notice\u003c/h1\u003e\r\n\u003cp\u003e\u003cstrong\u003eLast updated: June 2026\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003ch3\u003e1. About this Privacy Notice\u003c/h3\u003e\r\n\u003cp\u003eThis privacy notice applies to the personal data we collect about you through our platform via the website located at \u003ca href=\"https://www.seatunique.com\"\u003ewww.seatunique.com\u003c/a\u003e (\u003cstrong\u003eWebsite\u003c/strong\u003e) and/or our applications for mobile devices (\u003cstrong\u003eApp\u003c/strong\u003e), or when you communicate with us. The Website and the App together form our service to you (\u003cstrong\u003ePlatform\u003c/strong\u003e).\u003c/p\u003e\r\n\u003cp\u003eThis privacy notice may change from time to time and, if it does, the up-to-date version will always be available on our Website. We will also tell you about any important changes to our privacy notice.\u003c/p\u003e\r\n\u003ch3\u003e2. Who we are\u003c/h3\u003e\r\n\u003cp\u003eWe are RMS Events Ltd (t/a Seat Unique) (\u003cstrong\u003eSeat Unique\u003c/strong\u003e, \u003cstrong\u003ewe\u003c/strong\u003e, \u003cstrong\u003eour\u003c/strong\u003e or \u003cstrong\u003eus\u003c/strong\u003e) with company number 11313999. Our registered address is 6-8 Greencoat Place London SW1P 1PL.\u003c/p\u003e\r\n\u003cp\u003eSeat Unique is the trusted technological platform offering premium access to live events. We sell tickets and associated products and services to events and experiences on behalf of events organisers, promoters, venues, producers, artists/performers, agents, teams, record labels and other persons involved in the organisation of events (\u003cstrong\u003eEvent Partners\u003c/strong\u003e).\u003c/p\u003e\r\n\u003ch3\u003e3. What personal data do we collect about you\u003c/h3\u003e\r\n\u003cp\u003eThis section informs you of what information we collect about you and why. Personal data means any information about an individual from which that individual can be identified.\u003c/p\u003e\r\n\u003cp\u003eWe may collect, use, store and transfer different kinds of personal data about you or in relation to you which we have grouped together as follows:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003e\u003cstrong\u003eIdentity Data \u003c/strong\u003eincluding first name, last name, username, password, date of birth, address, email address and phone number. In addition we may collect the same information in relation to any contacts that you share with us.\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eTechnical Data \u003c/strong\u003eincluding internet protocol (IP) address, login data, browser type and version, device identifiers, mobile device tokens, time zone setting and location, preferred language, browser plug-in types and versions, device screen size, unique device identifiers, geographic location, operating system and platform and other technology on the devices you use to access our Platform. We may use these identifiers to manage and deliver push notifications to your device and to record your notification preferences.\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eUsage Data \u003c/strong\u003eincluding information about how you use the Platform and services.\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eTransaction Data \u003c/strong\u003eincluding details about payments to and from you (including via our payment partner, Stripe) and other details of any services you have purchased from us. Note that we do not collect or store any card payment or other financial details outside of pure records of transaction (e.g. purchase history and amounts paid).\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eMarketing and Communications Data \u003c/strong\u003eincluding your preferences in receiving marketing from us and third parties and your marketing communication preferences.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eWe also collect, use and share \u003cstrong\u003eAggregated\u003c/strong\u003e \u003cstrong\u003eData\u003c/strong\u003e such as statistical or demographic data for any purpose. Aggregated Data is not considered personal data in law as this data does not directly or indirectly reveal your identity. An example of Aggregated Data would be where we use your Usage Data to calculate the percentage of users accessing a specific Website feature. If the Aggregated Data is combined with other personal data to directly or indirectly identify you, we will treat this combined data as personal data and in accordance with this privacy notice.\u003c/p\u003e\r\n\u003cp\u003eOther than in respect of any accessibility requirement information (which we seek to obtain to ensure you have the best experience when attending events), we \u003cstrong\u003edo not\u003c/strong\u003e seek to collect your \u003cstrong\u003eSpecial Category Data\u003c/strong\u003e which means details about your race or ethnicity, religious or philosophical beliefs, sex life, sexual orientation, political opinions, trade union membership, information about your health and genetic and biometric data; and personal data related to criminal offences or criminal records.  If you do share Special Category Data with us, including in respect of accessibility requirements, this will be via your consent.\u003c/p\u003e\r\n\u003ch3\u003e4. How your personal data is collected\u003c/h3\u003e\r\n\u003cp\u003eWe use different methods to collect data from and about you including through:\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eDirect interactions:\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eWe collect personal data about you if you fill in forms on the Platform or correspond with us by telephone, email, WhatsApp or otherwise. This includes information you provide when you:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eregister to use our Platform or our services (including buying a ticket or receiving the transfer of a ticket);\u003c/li\u003e\r\n  \u003cli\u003eenter a competition, promotion or survey; or\u003c/li\u003e\r\n  \u003cli\u003ereport a problem with our Platform or give us feedback;\u003c/li\u003e\r\n  \u003cli\u003espeak with our customer services team (see Call Recording and Monitoring below).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003eCall Recording, Monitoring and Transcription:\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eWe may monitor and/or record telephone calls between you and our customer service or support teams. These recordings may also be transcribed using automated voice-to-text technology to create written records of the conversations. These recordings and transcriptions may include personal data.\u003c/p\u003e\r\n\u003cp\u003eWe carry out call recording and transcription for the following purposes:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eto ensure and improve the quality of our services,\u003c/li\u003e\r\n  \u003cli\u003eto support training and performance monitoring,\u003c/li\u003e\r\n  \u003cli\u003eto maintain accurate records of interactions,\u003c/li\u003e\r\n  \u003cli\u003eto help resolve queries or complaints, and\u003c/li\u003e\r\n  \u003cli\u003eto comply with our legal and regulatory obligations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003eAutomated technologies or interactions:\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eIf you use our Platform we automatically collect the following information:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eweb usage information (e.g. IP address), your login information, browser type and version, time zone setting, operating system and platform; and\u003c/li\u003e\r\n  \u003cli\u003einformation about your visit, including the full Uniform Resource Locators (URLs) clickstream to, through and from our Platform (including date and time); time on page, page response times, download errors, length of visits to certain pages, page interaction information (such as scrolling, clicks and mouse-overs).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eWhere we collect information about you in the ways described above, we do so on the basis that it is in our legitimate interests to collect and process this data. In most situations this will be anonymised but we collect and process this data to ensure that our Platform is functioning properly and that our customer experience is to the standard that you and we expect.\u003c/p\u003e\r\n\u003cp\u003eThe Platform contains links to and from third-party websites, plug-ins and applications. If you follow a link to any of these websites or authorise integration with any of the partners featured on the Platform, please note that these websites and partners have their own privacy policies and that we do not accept any responsibility or liability for these policies. When you leave our Platform, we encourage you to read the privacy notice of every website you visit.\u003c/p\u003e\r\n\u003cp\u003eWe also use cookies on our Platform. Please see the section on Cookies in this privacy notice for more information.\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eInformation we receive from other sources:\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eWe are also working closely with third parties, (including, for example, business partners assisting us with email outreach, sub-contractors in technical and payment services, bot protection services, advertising networks, analytics providers and search information providers) and may receive information about you from them.\u003c/p\u003e\r\n\u003cp\u003eWe may use specialist data enrichment providers to assist us with supplementing the data we hold on you with aggregated, anonymised lifestyle data. This helps us to understand your interests and preferences, so we can provide you with information which is likely to be most relevant to you and improve your experience of our products and services. When we receive information from other sources, we rely on them having the appropriate provisions in place telling you how they collect data and who they may share it with. We carefully check our sources to ensure that we only receive your information when it is lawful for us to do so.\u003c/p\u003e\r\n\u003ch3\u003e5. Purposes for which we will use your personal data\u003c/h3\u003e\r\n\u003cp\u003eThis section explains how we will use your personal data to carry out the activities relevant to the provision of our services to you and which of the legal bases we rely on to do so. We have also identified what our legitimate interests are where appropriate.\u003c/p\u003e\r\n\u003cp\u003ePlease note that we may process your personal data 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eConsent\u003c/li\u003e\r\n                  \u003cli\u003ePerformance of a contract with you\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo manage our relationship with you (including notifying you about changes to our terms or privacy notice)\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003ePerformance of a contract with you\u003c/li\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (to keep our records updated and study how users use our services)\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo administer and protect our business and the Platform (including troubleshooting, data analysis, testing, system maintenance, support, reporting and hosting of data)\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eTechnical\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (for running our business, provision of administration and IT services, network security, anti-fraud protection and in the context of a business reorganisation or group restructuring exercise)\u003c/li\u003e\r\n                  \u003cli\u003eNecessary to comply with a legal obligation\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo deliver relevant Platform content and advertisements to you and measure or understand the effectiveness of the advertising we serve to you\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eTechnical\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (to study how customers use our services, to analyse data and research trends to grow our business and to inform our marketing strategy)\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo use data analytics to improve our Platform, products/services, marketing, customer relationships and experiences\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eTechnical\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (to define types of customers for our services, to keep the Platform updated and relevant, to develop our business and to inform our marketing strategy)\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo personalise features and content to you\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eTechnical\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eConsent\u003c/li\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (to provide a personalised and more relevant service to our customers)\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo send offers and promotions relating to our services that you may be interested in\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eConsent\u003c/li\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests where we rely upon the soft opt-in to send marketing messages\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo receive, consider and respond to any communications you send to us\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eIdentity\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eNecessary for our legitimate interests (to respond to your communication)\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n    \u003ctr\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003eTo send push notifications and manage notification preferences\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eTechnical\u003c/li\u003e\r\n                  \u003cli\u003eUsage\u003c/li\u003e\r\n                  \u003cli\u003eMarketing and Communications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n      \u003ctd style=\"border: 2px solid #000; padding: 8px; vertical-align: top;\"\u003e\u003cul style=\"margin: 0; padding-left: 20px;\"\u003e\r\n                  \u003cli\u003eConsent\u003c/li\u003e\r\n                  \u003cli\u003eNecessary for legitimate interests for essential service notifications\u003c/li\u003e\r\n                \u003c/ul\u003e\u003c/td\u003e\r\n    \u003c/tr\u003e\r\n  \u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eIn addition to the purposes set out above, we may also process your personal data for other purposes that we deem compatible with those listed above.  We will update this privacy notice accordingly, when we do this.\u003c/p\u003e\r\n\u003ch3\u003e6. Communications\u003c/h3\u003e\r\n\u003cp\u003eThis section is to explain how we will ensure that you only receive communications that you wish to receive.\u003c/p\u003e\r\n\u003ch4\u003eMarketing communications\u003c/h4\u003e\r\n\u003cp\u003eWe want to ensure that you are informed and aware of the best events, promotions and our services that we can offer you. By consenting to receive additional communications (e.g. by email) from us and any named third parties that feature at the point of obtaining consent in respect of such information, we will process your personal data in accordance with this privacy notice.\u003c/p\u003e\r\n\u003cp\u003eIf you have provided your consent to receive marketing communications from us and you change your mind, you can change your preferences and unsubscribe at any time by following the unsubscribe instructions provided in the materials (e.g. the ‘unsubscribe’ link in emails) or contacting us at \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e.  Please note that we will action your request as soon as possible but it may take up to 10 days to update.\u003c/p\u003e\r\n\u003ch4\u003eService communications\u003c/h4\u003e\r\n\u003cp\u003eAs detailed above, we may send you communications such as those which relate to any service updates or provide customer satisfaction surveys. We consider that we can lawfully send these communications to you as we have a legitimate interest to do so, namely to effectively provide you with the best service we can and to grow our business.\u003c/p\u003e\r\n\u003ch4\u003ePush Notifications\u003c/h4\u003e\r\n\u003cp\u003eIf you use our App, we may send you push notifications about events, offers and promotions, account activity, ticket updates, service-related information.\u003c/p\u003e\r\n\u003cp\u003eWe will only send marketing push notifications where you have chosen to receive them through your device or App settings.\u003c/p\u003e\r\n\u003cp\u003eTo provide push notifications, we may collect and process device identifiers and notification tokens associated with your mobile device.\u003c/p\u003e\r\n\u003cp\u003eYou can stop receiving push notifications at any time by updating your preferences within the App (where available); or changing your device notification settings. Disabling push notifications will not affect your ability to use the App or access purchased tickets, although you may miss important updates.\u003c/p\u003e\r\n\u003ch3\u003e7. Who will have access to your personal data\u003c/h3\u003e\r\n\u003cp\u003eThis section is to explain who, within Seat Unique, will have access to your data. Your personal data will only be seen or used by our employees or those engaged by us that have a legitimate business need to access your personal data for the purposes set out in this privacy notice.\u003c/p\u003e\r\n\u003cp\u003eWe take your privacy seriously and have implemented appropriate physical, technical and organisational security measures (including offering two-factor authentication) designed to secure your personal data against accidental loss, destruction or damage and unauthorised access, use, alteration or disclosure.\u003c/p\u003e\r\n\u003ch3\u003e8. Who else might we share your personal data with\u003c/h3\u003e\r\n\u003cp\u003eThis section will inform you of who we share your personal data with and why. Except as explained in this privacy notice, we will not share your personal data without your consent unless required to do so by law.\u003c/p\u003e\r\n\u003cp\u003eWe may disclose your personal data to law enforcement agencies or court to the extent necessary for purposes including preventing, investigating, detecting, and prosecuting criminal offences; preventing threats to public security in accordance with applicable law; or validating a claim.\u003c/p\u003e\r\n\u003cp\u003eWe may share your personal data with third parties who assist us with administering the provision of our services to you, including:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003ecompanies within the Seat Unique group in order to provide our services, operate our business efficiently, or fulfil our contractual obligations to you. Certain services may be performed by other members of the Seat Unique group on our behalf. This may include: (i) order processing and fulfilment; (ii) ticket dispatch and delivery; (iii) customer support services; (iv) payment administration and finance operations; (v) IT, systems administration and hosting; and (vi) business reporting and analytics. They have access to personal data needed to perform their functions but may not use it for other purposes;\u003c/li\u003e\r\n  \u003cli\u003ebusiness partners, suppliers and sub-contractors for the performance of any contract we enter into with them or you. This includes our Event Partners, so that they can run the event and fulfil any other processing purpose detailed within their own privacy notice. We will always name the Event Partners when you purchase a ticket and you will be given the option to subscribe to receive marketing from them. If you would like to understand more about our data sharing with Event Partners please do feel free to get in touch at \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e;\u003c/li\u003e\r\n  \u003cli\u003eanalytics and search engine providers that assist us in the improvement and optimisation of our Platform; and\u003c/li\u003e\r\n  \u003cli\u003eagents we engage to perform functions on our behalf including sending customer communications, couriering and delivering tickets, providing ticket insurance, analysing data (including our third party data enrichment providers), providing marketing assistance, processing payments, hosting our IT infrastructure, researching customer satisfaction and providing customer service. They have access to personal data needed to perform their functions but may not use it for other purposes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eWe may also pass Aggregated Data on the usage of our Platform (e.g. we might disclose the numbers of visitors to our Platform that come from different geographic areas) to third parties but this will not include information that can be used to identify you personally.\u003c/p\u003e\r\n\u003cp\u003eIf a business transfer or change of business ownership takes place or is envisaged, we may transfer your personal data to the new owner (or a prospective new owner). If this happens, you will be informed of this transfer.\u003c/p\u003e\r\n\u003ch3\u003e9. How we protect your personal data\u003c/h3\u003e\r\n\u003cp\u003eThis section explains how we keep your personal data safe and where it will be held.\u003c/p\u003e\r\n\u003cp\u003eWe take your privacy seriously and are committed to maintaining the privacy and security of the personal data you provide to us, and the choices you have regarding our collection and use of your personal data.\u003c/p\u003e\r\n\u003cp\u003eOnce we have received your personal data, we follow strict security procedures as to how your personal data is stored and used, and who sees it, to help stop any unauthorised access.\u003c/p\u003e\r\n\u003cp\u003eThe information that we collect from you may be stored at, and (if applicable) transferred to, a destination outside of the United Kingdom and the European Economic Area (\u003cstrong\u003eEEA\u003c/strong\u003e). When we store your personal data outside of the United Kingdom and EEA we will ensure that it is adequately protected by using appropriate safeguards.\u003c/p\u003e\r\n\u003ch3\u003e10. How long we keep your personal data for\u003c/h3\u003e\r\n\u003cp\u003eThis section explains the length of time that we will retain your personal data.\u003c/p\u003e\r\n\u003cp\u003eWe will keep your personal data for no longer than is necessary for the purposes for which it was obtained. The criteria for determining the duration for which we will retain your personal data are as follows:\u003c/p\u003e\r\n\u003cp\u003ea) whether we maintain an ongoing relationship with you;\u003c/p\u003e\r\n\u003cp\u003eb) whether we have a lawful purpose to process your personal data (e.g. any laws requiring us to keep transaction records for a certain time period before deleting them); and\u003c/p\u003e\r\n\u003cp\u003ec) what the limitation period is under applicable law (i.e. any period during which any person could bring a legal claim against us in connection with your personal data, or to which your personal data may be relevant).\u003c/p\u003e\r\n\u003cp\u003eDuring the periods in paragraphs (a) and (b) above, we will restrict our processing of your personal data to the storage of, and maintaining the security of, those data, except to the extent that those data need to be reviewed in connection with any legal claim or obligation under applicable law.\u003c/p\u003e\r\n\u003cp\u003eAfter this period your personal data will be anonymised so that you are no longer identified or identifiable from such information.\u003c/p\u003e\r\n\u003cp\u003eAny third parties that we engage will keep your data stored on their systems for as long as is necessary to provide the relevant services to you or us. If we end our relationship with any third party providers, we will make sure that they securely delete or return your personal data to us.\u003c/p\u003e\r\n\u003cp\u003eWe may retain personal data about you for statistical purposes. Where data is retained for statistical purposes, it will always be anonymised, meaning that you will not be identifiable from that data.\u003c/p\u003e\r\n\u003ch3\u003e11. Your rights\u003c/h3\u003e\r\n\u003cp\u003eUnder certain circumstances, you have a number of rights in relation to your personal data. There are circumstances in which your rights may not apply. You have the right to request that we:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eprovide you with a copy of the information we hold about you;\u003c/li\u003e\r\n  \u003cli\u003eupdate any of your personal data if it is inaccurate or out of date;\u003c/li\u003e\r\n  \u003cli\u003edelete the personal data we hold about you - if we are providing services to you and you ask us to delete personal data we hold about you then we may be unable to continue providing those services to you;\u003c/li\u003e\r\n  \u003cli\u003erestrict the way in which we process your personal data;\u003c/li\u003e\r\n  \u003cli\u003estop processing your data if you have valid objections to such processing; and\u003c/li\u003e\r\n  \u003cli\u003etransfer your personal data to a third party.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eFor more information on your rights and how to use them, or if you would like to make any of the requests set out above, please contact us at \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e.\u003c/p\u003e\r\n\u003cp\u003eWe may need to request specific information from you to help us confirm your identity and ensure your right to access your personal data (or to exercise any of your other rights). This is a security measure to ensure that personal data is not disclosed to any person who has no right to receive it. We may also contact you to ask you for further information in relation to your request to speed up our response.\u003c/p\u003e\r\n\u003cp\u003eAs explained in the section on Communications above, even if you consented to the processing of your personal data for marketing purposes (by ticking the relevant box or by requesting information about services), you have the right to ask us to stop processing your personal data for such purposes. You can exercise this right at any time by following the unsubscribe instructions provided in the materials (e.g. the ‘unsubscribe’ link in emails) or contacting us at \u003ca href=\"mailto:help@seatunique.com\"\u003ehelp@seatunique.com\u003c/a\u003e.\u003c/p\u003e\r\n\u003ch3\u003e12. Cookies\u003c/h3\u003e\r\n\u003cp\u003eThe Platform uses cookies, please visit our Cookies Policy \u003ca href=\"/cookies-policy\"\u003ehere\u003c/a\u003e for more information.\u003c/p\u003e\r\n\u003ch3\u003e13. More Information / Complaints\u003c/h3\u003e\r\n\u003cp\u003eWe take data protection seriously and aim to resolve any concerns fairly and promptly. If you have any questions or if you are unhappy with how we have handled your personal data or responded to a request, you can contact us directly by emailing us at \u003ca href=\"mailto:help@seatunique.com\"\u003e\u003cstrong\u003ehelp@seatunique.com\u003c/strong\u003e\u003c/a\u003e.\u003c/p\u003e\r\n\u003ch4\u003eAcknowledging and verifying your complaint\u003c/h4\u003e\r\n\u003cp\u003eWe will acknowledge your complaint within 30 days of receiving it.\u003c/p\u003e\r\n\u003cp\u003eTo protect personal data, we may need to confirm your identity before we can investigate your complaint. We might ask for additional information or documentation. If someone is making the complaint on your behalf, we may also need evidence that they are authorised to act for you. If we cannot verify identity or authority, we may not be able to proceed with the complaint.\u003c/p\u003e\r\n\u003ch4\u003eHow we investigate your complaint\u003c/h4\u003e\r\n\u003cp\u003eWhen investigating your complaint, we may review the details of your complaint, check the records and information we hold, speak with relevant members of our team and/or request further information from you if needed. If we need additional information, we’ll let you know what’s required and the timeframe for providing it.\u003c/p\u003e\r\n\u003cp\u003eWe’ll keep you updated on progress where appropriate.\u003c/p\u003e\r\n\u003ch4\u003eOutcome of your complaint\u003c/h4\u003e\r\n\u003cp\u003eWe will inform you of the outcome of the complaint without undue delay.\u003c/p\u003e\r\n\u003cp\u003eWe will explain clearly what we've done to resolve your complaint and, where appropriate, any action we have taken as a result.\u003c/p\u003e\r\n\u003ch4\u003eIf you’re not satisfied\u003c/h4\u003e\r\n\u003cp\u003eIf you are unhappy with our response, you have the right to raise your complaint with the Information Commissioner’s Office (ICO) or you can seek to take action in the courts.\u003c/p\u003e\r\n\u003cp\u003eMore details on how to complain to the ICO are available on the \u003ca href=\"https://ico.org.uk/make-a-complaint/\" rel=\"noopener noreferrer\" style=\"text-decoration: underline;\"\u003eComplaints\u003c/a\u003e page of the ICO’s website.\u003c/p\u003e\r\n\r\n35:T925e,\u003cspan class=\"sc-3b1f3082-0 ctaICw\"\u003e\r\n\u003cstyle\u003e\r\n   /* Level 1: Top-level counter (e.g., 11.) */\r\nol.custom-counter {\r\n  list-style: none;\r\n  counter-reset: section;\r\n  padding-left: 1em;\r\n}\r\n\r\nol.custom-counter \u003e li {\r\n  counter-increment: section;\r\n  margin-bottom: 0.5em;\r\n}\r\n\r\nol.custom-counter \u003e li::before {\r\n  content: counter(section) \". \";\r\n  font-weight: bold;\r\n}\r\n\r\n/* Level 2: 03e li \u003e ol \u003e li \u003e ol \u003e li \u003e ol \u003e li {\r\n  counter-increment: level5;\r\n  padding: 10px 0;\r\n}\r\n\r\nol.custom-counter \u003e li \u003e ol \u003e li \u003e ol \u003e li \u003e ol \u003e li \u003e ol \u003e li::before {\r\n  content: counter(section) \".\" counter(subsection) \".\" counter(subsubsection) \".\" counter(level4) \".\" counter(level5) \" \";\r\n  font-weight: bold;\r\n  padding-right: 6px;\r\n}\r\n  \u003c/style\u003e\r\n\r\n\u003ch1\u003eTerms \u0026 Conditions of Purchase\u003c/h1\u003e\r\n\r\n\r\n\r\n\u003cp\u003e\r\n These terms and conditions of purchase (“\r\n \u003cstrong\u003e\r\n  Terms\u003c/strong\u003e”) set out the terms applicable to the purchase and sale of tickets and packages on \u003ca href=\"https://www.seatunique.com\"\u003ewww.seatunique.com\u003c/a\u003e, any sub-domains (including white labelled sites) and the Seat Unique app and (together the “Site”) (unless alternative tailored Event Partner T\u0026Cs are stated to apply). They set out:\u003c/p\u003e\r\n\u003cul\u003e\r\n \u003cli\u003e\r\n  your legal rights and responsibilities;\r\n \u003c/li\u003e\r\n \u003cli\u003e\r\n  Seat Unique’s legal rights and responsibilities;\r\n \u003c/li\u003e\r\n \u003cli\u003e\r\n  certain key information required by law; and\r\n \u003c/li\u003e\r\n \u003cli\u003e\r\n  everything else that you need to know about us, before you make a purchase.\r\n \u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\r\n In these Terms:\r\n\u003c/p\u003e\r\n\u003cul\u003e\r\n \u003cli\u003e\r\n  RMS Events Ltd (t/a Seat Unique) is a private company limited by shares and registered in England and Wales with company number 11313999 and its registered office at 6-8 Greencoat Place, London, SW1P 1PL (“\r\n  \u003cstrong\u003e\r\n   Seat Unique\u003c/strong\u003e”, “\u003cstrong\u003ewe\u003c/strong\u003e”, “\u003cstrong\u003eus\u003c/strong\u003e” and “\u003cstrong\u003eour\u003c/strong\u003e”).\r\n  \u003c/strong\u003e\r\n \u003c/li\u003e\r\n \u003cli\u003e\r\n  “\r\n  \u003cstrong\u003e\r\n   You\u003c/strong\u003e” and “ \u003cstrong\u003eyour\u003c/strong\u003e” means the person using the Platform to make a purchase.\r\n  \r\n \u003c/li\u003e\r\n \u003cli\u003e\r\n  Please read these Terms carefully before you make a purchase. By purchasing from us, you confirm you agree with these Terms in full and any third-party terms applicable to the tickets and/or Event Partners and/or Event, terms of entry, dress code and/or terms of the venue (“\r\n  \u003cstrong\u003e\r\n   Third Party Terms\u003c/strong\u003e”).  You will always be subject to these Terms and the Third Party Terms. Please \u003ca href=\"/contact-us\"\u003eContact Us\u003c/a\u003e if you have any queries about any restrictions in relation to your Tickets. Fan-to-fan resale tickets shall be subject to separate terms and conditions.\r\n  \r\n \u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\r\n \u003cstrong\u003e\r\n  We would specifically like to draw your attention to condition 5.9 on our pricing, condition 9 in relation to cancellations and refunds and condition 11 in these Terms where we limit our liability to you.\r\n \u003c/strong\u003e\r\n\u003c/p\u003e\r\n\u003cp\u003e\r\n If you don’t understand or are unclear about any of the terms in this document and want to talk to Seat Unique about it, please contact us by email at \u003ca href=\"mailto:enquiries@seatunique.com\"\u003eenquiries@seatunique.com\u003c/a\u003e.\r\n\u003c/p\u003e\r\n\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\r\n \u003cstrong\u003e\r\n  The Event Partner is responsible for the provision of the Event.\r\n \u003c/strong\u003e\r\n\u003c/p\u003e\r\n\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 0;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\n  Ticket, Packages and Hospitality Requirements\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003eThe number and type of Tickets made available for purchase on the Platform will vary on an event by event basis and is not guaranteed.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seating maps and charts and other photos and advertising materials displayed during the Ticket purchase process are for guidance only. For some Events, the layout and specific seat locations, or allocated seating, may vary without notice.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n When buying any Tickets you agree to be legally bound by:\r\n\u003col\u003e\r\n\u003cli\u003ethese Terms;\u003c/li\u003e\r\n\r\n\u003cli\u003e\r\nSeat Unique’s website \u003ca href=\"/terms-of-use\"\u003eTerms of Use\u003c/a\u003e and any terms of the Seat Unique App;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nany special terms and conditions stated to be applicable to an Event; and\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nthe Third Party Terms.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\nThe documents in condition 1.3 together form part of your contract with us.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nTickets cannot be exchanged or refunded after purchase save in accordance with these Terms. Nothing in these Terms affects your statutory rights as a consumer.\r\n\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003e\u003cbr\u003e \r\n\r\n\r\n\u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 1;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\n  Ticket Types and associated Hospitality Items\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Seat Unique owns and operates a marketplace on the Site (“\u003cstrong\u003ePlatform \u003c/strong\u003e”) on which tickets (sold on a ticket-only basis) (“\u003cstrong\u003eTickets\u003c/strong\u003e”) and packages (which include a Ticket and one or more Hospitality Items as detailed in condition 2.3 (“\u003cstrong\u003ePackages\u003c/strong\u003e”) to events and/or experiences (“\u003cstrong\u003eEvents\u003c/strong\u003e”) are:\u003col\u003e\r\n\r\n\u003cli\u003e\r\n sold by us;\u003c/li\u003e\r\n\r\n\u003cli\u003e\r\nsold by us for or on behalf of events organisers, promoters, venues, producers, artists/performers, agents, teams, record labels and any other persons involved in the organisation of Events (such persons hereinafter being referred to as Seat Unique’s “\u003cstrong\u003eEvent Partners\u003c/strong\u003e”); and/or\u003c/li\u003e\r\n\r\n\r\n \u003cli\u003esold by Event Partners directly.\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\u003cli\u003e\r\nThese Terms and any Third Party Terms apply to your purchase of Ticket(s) and Package(s). In the event of any conflict or inconsistency between these Terms and any Third Party Terms, these Terms shall take precedence.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Additional products or services such as, corporate hospitality, accommodation, exclusive seating arrangements, souvenirs, car parking, transport or merchandising (hereinafter referred to as “\u003cstrong\u003eHospitality Items\u003c/strong\u003e”) may be included within a Package.\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n\r\n\r\n\r\n   \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 2;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\n  Your Seat Unique account\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\nYou will need a Seat Unique account to purchase a Ticket or Package.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n You are solely responsible for maintaining the security of your account. You shall not permit anyone other than you to use your account. If you become aware or suspect that anyone knows your user name and/or password, you should promptly contact Seat Unique.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n If you are making purchases on behalf of other persons, a company or other legal entity, you represent and warrant that you have the authority to bind those persons or that company or other legal entity (and these Terms and references to “you” refer and apply to those persons or that company or other legal entity).\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n If Seat Unique is investigating your account, or if Seat Unique is investigated ourselves, you agree to comply fully with Seat Unique’s requests for information about you and your purchases.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n You must not create or use multiple accounts with the purpose or intention of circumventing any of these Terms or concealing your identity or personal details.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nYou must not use any Platform for any unlawful purpose or in any unlawful manner. If Seat Unique discovers or suspects that you have used or are using or attempting to use any Platform in such a way that a criminal offence has been, is being or might be committed, Seat Unique is required by law to report your identity and details of such activity to the relevant authorities (and any relevant Event Partner).\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique reserves the right to terminate your account and/or cancel all/any of your orders and/or prohibit you from making future orders or using the Platform in the future if:\r\n\u003col\u003e\r\n\u003cli\u003e\r\n any abusive or threatening behaviour is carried out by you or on your behalf or via your account;\u003c/li\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique suspect any fraudulent activity or other illegal activity is carried out by you or on your behalf or via your account;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nSeat Unique suspect any unauthorised use of your account or other unauthorised activity is carried out by you or on your behalf or via your account;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique is ordered to do so by any legal or regulatory authority; and/or\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nyou otherwise breach these Terms or any other applicable policies or terms and conditions (including any applicable Event Partner’s terms and conditions).\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\nYou may close your account at any time by \u003ca href=\"mailto:enquiries@seatunique.com\"\u003econtacting us\u003c/a\u003e. Such closure shall not take effect until after any events that you have purchased Ticket(s)/Package(s) for have taken place.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n   \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 3;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\nOrdering from Seat Unique\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\nTo make a purchase from Seat Unique and you must be 18 years old or more. Event Partners may impose further eligibility requirements that you must comply with.\r\n \u003c/strong\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nYou place an order on the relevant Platform. The Sale Price must be paid immediately on placing an order.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nYou must check your order carefully before submitting it (including delivery details and emails). If you need to correct errors, you can do so before submitting your order. It is your responsibility to ensure that all the details are correct before you make and order.\r\n\u003c/li\u003e\r\n\u003cli\u003e\u003cstrong\u003e You are unable to cancel, refund or exchange an order after it is placed.\r\n \u003c/strong\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n When you place your order at the end of the online checkout process via the Platform we will acknowledge your order via email. Such acknowledgement is not an order confirmation.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nSeat Unique may contact you at any point before the Event to say that Seat Unique does not accept your order. This is typically for the following reasons:\r\n\u003col\u003e\r\n\u003cli\u003e\r\nthe Ticket(s)/Package(s) are unavailable;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nSeat Unique cannot authorise your payment;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nyou are not allowed to buy from us, and/or we are not allowed to sell to you the Ticket(s)/Package(s);\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n where an Event Partner has told us that an individual is on their suspended/banned list that and we are not be permitted to sell to them;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nyou have ordered too many Tickets/Packages; or\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nthere has been a mistake on the pricing or description of the Ticket(s)/Package(s).\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\nYour order will only be accepted by Seat Unique (and a binding contract between the parties) when you have paid for your order in full and cleared funds and Seat Unique has expressly emailed you to confirm this. At this point:\r\n\u003col\u003e\r\n\u003cli\u003e\r\na legally binding contract will be in place between you and Seat Unique based on the documents in condition 1.3; and\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique will arrange for the Tickets and Hospitality Items to be delivered to you if applicable (see condition 6), made available online and/or make the Ticket (and/or any applicable Hospitality Item) available for collection.\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\u003cli\u003e\r\n Certain Event Partners may require certain additional information and/or proof of ID from you in respect of you and any other attendees prior to issuing a Ticket and Hospitality Items. Your entitlement to the Ticket (and any associated Hospitality Items) shall be conditional on the provision by you of such information. This may include (without limitation) the name and date of birth of all attendees which is a prerequisite of certain football clubs, or confirmation of your age when purchasing food and beverage. Subject to condition 4.10, you will not be offered a refund on your order if your Ticket/Package and/or Hospitality Item(s) is not issued due to your failure to provide such details when requested. Please see the relevant Third Party Terms for further details.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Further security and/or bag checks may be conducted on entry.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Where your Package includes a meet and greet experience with the artist/performer/speaker, you may be required to provide additional information in order that the Event Partner and/or artist can perform enhanced security screening procedures. If this is applicable, it will be flagged on the purchase page, and you will be provided with additional information as to the nature of the checks post-purchase.  Purchasers and attendees are not legally obligated to consent to these checks. However, refusal to undergo, or failure to pass, any required security screening may result in one of the following actions at the sole discretion of the Event Partner:\r\n\u003col\u003e\r\n\u003cli\u003e\u003cstrong\u003eCancellation of the Ticket/Package\u003c/strong\u003e, in which case you will be offered a refund of the Sales Price, or\u003c/li\u003e\r\n\u003cli\u003e\u003cstrong\u003eRevocation of access to the meet and greet\u003c/strong\u003e, while still allowing entry to the main event (e.g. concert or performance), if applicable. No refund will be offered.\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\u003cp\u003e\r\n  These measures are in place to ensure the safety and comfort of all participants, including the artist, staff, and fellow attendees.\r\n \u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n\r\n   \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 4;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\nPrices and Payment\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\nIf the currency selected on the Platform isn’t the same as the Event Partner’s currency, Seat Unique may show prices in your own currency.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nThe price of the Ticket/Package(s) as advertised on the Platform is inclusive of VAT or any similar sales taxes (where payable, and unless stated otherwise). The price for the Ticket/Package(s) is the “\r\n \u003cstrong\u003e\r\n  Sale Price”.\r\n \u003c/strong\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nThe following may be added to the advertised Sale Price:\r\n\u003col\u003e\r\n\u003cli\u003e\r\nadditional non-refundable service charges relevant to the Ticket/Package(s) (“\u003cstrong\u003eService Charge\u003c/strong\u003e”); and\u003c/li\u003e\r\n\u003cli\u003enon-refundable administration, handling, booking fee(s) or delivery charge(s) (“\u003cstrong\u003eAdministration Fees”).\u003c/strong\u003e\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\nSeat Unique generally accepts BACS transfer and the following cards as payment and: Visa, Mastercard and American Express. Generally, payment may be made (on compatible devices) through Apple Pay and Google Pay. Sometimes, Event Partners will have preferred payment methods displayed during the purchasing process that shall take precedence over this condition.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nSeat Unique will do what it reasonably can to ensure that the information you provide Seat Unique when making payment is secure. See the \u003ca href=\"/privacy-policy\"\u003ePrivacy Policy\u003c/a\u003e for further information. In the absence of negligence on Seat Unique’s part, any failure by Seat Unique to comply with these Terms or the \u003ca href=\"/privacy-policy\"\u003ePrivacy Policy\u003c/a\u003e or breach by Seat Unique of its duties under applicable laws, Seat Unique will not be responsible to you for any loss that you may suffer if a third party gains unauthorised access to any information that you give to Seat Unique.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nAll payments by credit card or debit card need to be authorised by the relevant card issuer. Seat Unique may also need to use extra security steps via Verified by Visa; Mastercard®SecureCodeTM; or American Express SafeKey. \u0026 3D Secure.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nWhilst Seat Unique try to ensure that all prices advertised on the Platform are accurate, errors may occur. If Seat Unique discovers an error in the price of any Ticket/Package(s) you have ordered, Seat Unique will notify you as soon as possible and give you the option of confirming your order at the correct Sale Price, in which case Seat Unique will credit or debit you as applicable based on the correct Sale Price, or cancelling your order.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nIf:\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Seat Unique is unable to contact you to confirm the correct Sale Price of your order;\u003c/li\u003e\r\n\u003cli\u003e\r\nyou do not respond to the notification of the correct Sale Price within the earlier of 10 days from notification and 2 days before the Event; or\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nyou would like to cancel your order based on the updated Sale Price,\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\u003cp\u003e\r\n  you agree that\r\n  \u003cstrong\u003e\r\n   Seat Unique may treat the full order as cancelled and issue you with a full refund.\r\n  \u003c/strong\u003e\r\n \u003c/p\u003e\r\n\u003cli\u003e\r\nTicket/Package prices on the Seat Unique Site may fluctuate in line with changing market conditions from time to time. Seat Unique and/or its Event Partners may choose to adjust Ticket/Package prices based on factors such as demand, availability and other relevant considerations. As a result, the sale price of a Ticket/Package may increase or decrease at any time. You will always pay the price that is displayed at the time of purchase. If the price of a Ticket/Package decreases after you have made your purchase, you will not be entitled to a refund or credit. It is possible that a different face value may be printed on your Ticket to the price you paid. In this case you will not be entitled to a refund or credit on the basis that you have paid a higher price for the Ticket/Package than the face value of the Ticket.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n    \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 5;\"\u003e\r\n\u003cli\u003e\u003cstrong\u003e\r\n  Delivery\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Where Ticket/Package(s) (and/or any associated Hospitality Items) are physically dispatched to you, depending on the arrangement with the relevant Event Partner this may be done by us, the Event Partner or their nominated dispatch provider. Not all Ticket/Package(s) (and/or associated Hospitality Items) will require physical delivery.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique reserve the right to:\r\n\u003col\u003e\r\n\u003cli\u003e\r\n make Tickets (and/or any associated Hospitality Items) available for collection by you at the Event, at a venue box office or at another designated ticket collection point, in each case as notified to you including by telephone or e-mail; and/or\u003c/li\u003e\r\n\u003cli\u003e\r\n Tickets as an e-Ticket which may require a purchaser to download a mobile (contactless) ticket and/or an applicable mobile application to access the Ticket, therefore purchasers must ensure their mobile phone is capable of downloading, storing and being compatible with the Ticket and that your mobile phone has enough battery and fully functional to enable the Ticket to be scanned at the venue.\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\nAny “delivery” of Tickets shall refer to the relevant method above in condition 6.2.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique cannot deliver the Tickets or any Hospitality Items if it is unable to properly identify you, therefore you may be asked to provide a form of ID (e.g. passport or photocard driving licence), your booking confirmation and/or the credit or debit card you used to pay for the Tickets. For your safety and protection, Seat Unique reserve the right to refuse to deliver (or make available for collection) the Ticket and Hospitality Items if Seat Unique cannot properly identify the buyer and in which case, it may treat the order as cancelled without refund or other compensation.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Seat Unique is not able to specify the exact dates of dispatch as the arrangements for delivery/collection will depend on (amongst other factors) when Seat Unique is in receipt of the Ticket. In some circumstances Seat Unique may only receive your Ticket from the Event Partner close to the date of the Event.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n If something happens that is outside of Seat Unique’s control and affects the date of delivery or making the Ticket available for collection, Seat Unique will notify you of a revised estimated date for delivery or collection of the Tickets and/or if the delivery or collection method has changed (e.g. where you need to pick the Tickets up at a venue box office).\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nDelivery or collection (as applicable) of the Tickets will take place when:\r\n\u003col\u003e\r\n\u003cli\u003e\r\nSeat Unique and/or the relevant Event Partner delivers them to the delivery address or collection point (as applicable) (e.g. box office); or\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n if being delivered by e mail or electronic means, 1 business day after the e mail has been sent to you by Seat Unique and/or the relevant Event Partner (or nominated dispatch partner).\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\n  It is your responsibility to notify us if you have not received your Tickets or Hospitality Items, or been able to collect your Tickets or Hospitality Items, prior to the Event.\r\n \u003c/strong\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n If you have any queries regarding the delivery or collection of your Tickets please \u003ca href=\"mailto:enquiries@seatunique.com\"\u003eContact Us\u003c/a\u003e.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Please ensure you check your Ticket/Package(s) are correct and contain the correct information, once they have been delivered as Seat Unique cannot always rectify the same.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n    \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 6;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\n  Information about your Ticket/Package(s)\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Any Ticket/Package you purchase on the Platform shall remain the strict property of the relevant Event Partner and is a personal revocable licence which may be withdrawn and admission refused at any time. If this occurs without any act or omission on your part, you will be refunded for the Ticket/Package (but excluding any Administration Fees). Where withdrawal or refusal of a Ticket/Package by an Event Partner is due to the acts or omissions on your part, any potential refund is at the discretion of the relevant Event Partner.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n It is possible that some Event Partners may have policies in place that restrict the issuing of replacement of Tickets where the original has been lost, stolen, damaged or destroyed (for example, where both original and replacement Tickets may be used to gain entry, which may compromise the capacity of a venue). If replacement Tickets are issued, you may be required to pay an administration fee subject to the Third Party Terms.\r\n\u003c/liu\u003e\r\n\u003cli\u003e\r\n If you have any access requirements that would impact your ability to make full enjoyment of the Ticket/Package(s) please contact the Event Partner or in the alternative, you can \u003ca href=\"/contact-us\"\u003eContact Us\u003c/a\u003e. While we will endeavour to assist you with this, we cannot guarantee that the Event Partner will have alternative accessible Ticket/Package(s) available and you should review the Third Party Terms for full information. Personal assistant Tickets/Packages are not generally available.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n    \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 7;\"\u003e\r\n    \u003cli\u003e\r\n \u003cstrong\u003e\r\nTicket/Package Restrictions\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n For certain Events, Seat Unique and/or Event Partners may restrict the number of Tickets/Packages that are available to any one person as notified on the Platform.\r\n \u003cstrong\u003e\r\n  In such circumstances Seat Unique may cancel any order(s) for Tickets/Packages purchased in excess of the restrictions without notice and without refund or other compensation.\r\n \u003c/strong\u003e\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Tickets/Packages may be sold subject to restrictions on entry or use, such as restricted, obstructed or side view or a minimum age for entry. Restrictions will be displayed or notified to you before or at the time you order. It is your responsibility to ensure that you read all notifications and other important information displayed or notified to you as part of the purchase process, before you place an order.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\nTickets and Packages purchased through the Platform may not be:\r\n\u003col\u003e\r\n\u003cli\u003e\r\n resold or transferred unless the Third Party Terms expressly permit the same. Event Partners generally prohibit the resale or transfer of tickets for Events. Any resale or transfer (or attempted resale or transfer) of a Ticket or Package in breach of the applicable law or any restrictions imposed by the Event Partner is grounds for seizure or cancellation of that Ticket/Package without refund or other compensation. In addition, the unauthorised sale or disposal of football tickets is a criminal offence under section 166 of the Criminal Justice and Public Order Act 1994, as amended by the Violent Crime Reduction Act 2006;\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n used you or any associated third parties for advertising, promotions, contests or sweepstakes (or for other such similar commercial gain); and/or\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n combined with any hospitality, travel or accommodation service and/or any other merchandise, product or service by you or any associated third parties to create a package for sale, resale or other distribution.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\u003cli\u003e\r\n Please note that advertised start times of Events are subject to change. Door opening and closing times of an Event are not indicative of the Event’s start or end time (or when an artist is scheduled to play or the length of the artist’s performance) all of which remain at the relevant Event Partner’s and/or artist’s discretion and may be subject to change.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Tickets/Packages are sold subject to the Event Partner’s right to alter or vary the programme of an Event due to events or circumstances beyond its reasonable control without being obliged to refund monies or exchange tickets, unless such change is a material alteration as described in condition 9, in which case the provisions of that condition shall apply.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Breach of any of the Third Party Terms or any unacceptable behaviour likely to cause damage, nuisance or injury may entitle the Event Partner to eject you from the Event and/or venue.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n    \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 8;\"\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\nYour Ticket/Package rights in relation to event cancellations and alterations\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\n  Events are always subject to the Event Partner’s and/or venue’s cancellation policy which you can usually find on the Event Partner’s website, in the Third Party Terms, during the booking process, in the fine print, and/or in the confirmation email or Ticket (if applicable).\u003c/strong\u003eThis means that some Tickets/Packages may be non-cancellable or unable to be altered. If you would like assistance in locating the Event Partner and/or venue’s cancellation policy, we recommend that you contact the relevant Event Partner / venue or \u003ca href=\"/contact-us\"\u003eContact Us\u003c/a\u003e directly.\r\n \r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n If an Event is cancelled, rescheduled or materially altered, Seat Unique will use reasonable endeavours to notify you once it has received the relevant information and authorisation from the applicable Event Partner. However, Seat Unique cannot guarantee that you will be notified of such cancellation or alteration before the date of the Event. It is your responsibility to ascertain whether an Event has been cancelled or altered and the date and time of any rescheduled Event.\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\n  Cancellation: Subject always to the relevant Event Partner’s cancellation policy \u003c/strong\u003e, if an Event for which you have purchased Ticket/Package(s) is cancelled in full (and not rescheduled) you will be offered a refund of the Sale Price of your Ticket/Package(s) for that Event only (Service Charges and Administration Fees are non-refundable).\r\n\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\n  Rescheduling: Subject always to the relevant Event Partner’s cancellation policy \u003c/strong\u003e, if an Event for which you have purchased Ticket/Package(s) is rescheduled, then, Ticket/Package(s) will usually be valid for the new date (or you will be offered Tickets/Packages of a value corresponding with your original Ticket/Package(s) for the rescheduled Event, subject to availability).  \u003cstrong\u003eRefunds will not be offered or issued for rescheduled Events unless the Event Partner’s cancellation policy expressly states that they will be. \u003c/strong\u003e\r\n\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Refunds will be paid by Seat Unique or the Event Partner (as applicable) subject to Third Party Terms. Where refunded by Seat Unique, this shall first be subject to authorisation from or payment to Seat Unique from the relevant Event Partner in order for Seat Unique to pass the refund to you and made by Seat Unique or the Event Partner (as applicable) using the same means of payment as you used for the initial purchase, unless notified otherwise by Seat Unique or the Event Partner (as applicable).\r\n\u003c/li\u003e\r\n\u003cli\u003e\r\n Nothing in this condition 9 shall operate to exclude your statutory rights as a consumer. Please note however that complimentary goods and services included within a Package which are not priced separately do not qualify for the statutory 14 day cooling off period.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n\r\n    \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 9;\"\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\n  Your privacy and personal information\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Your privacy and personal information are of the upmost important to Seat Unique. Any personal information that you provide to Seat Unique will be dealt with in line with Seat Unique’s \u003ca href=\"/privacy-policy\"\u003ePrivacy Policy\u003c/a\u003e, which explains what personal information Seat Unique collect from you, how and why Seat Unique collect, store, use and share such information, your rights in relation to your personal information and how to contact Seat Unique and supervisory authorities if you have a query or complaint about the use of your personal information.\r\n\u003c/li\u003e\u003c/ol\u003e\r\n\r\n   \u003c/li\u003e\r\n    \u003c!-- Continue same nested formatting for sections 2 through 13 --\u003e\r\n  \u003c/ol\u003e\r\n\r\n\r\n\r\n\u003cbr\u003e\u003cbr\u003e\r\n\u003col class=\"custom-counter\" style=\"counter-reset: section 10;\"\u003e\r\n\u003cli\u003e\r\n \u003cstrong\u003e\r\nLimit on Seat Unique’s responsibility to you\r\n \u003c/strong\u003e\r\n\u003col\u003e\r\n\u003cli\u003e\r\n Seat Unique undertakes a vetting procedure in respect of Event Partners and hopes to work with Event Partners that will bring you the best in live entertainment, service and hospitality and offer official, guaranteed access to Events. However, Seat Unique cannot accept responsibility for the delivery or quality of any products and/or services sold with a Ticket/Package (unless, as applicable, the same are delivered or produced directly by Seat Unique and considered Hospitality Items under these Terms). Products and/or services sold with a Ticket/Package and the Event itself are provided and fulfilled by the relevant Event Partner, who
