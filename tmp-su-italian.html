 0);\"\u003eYou agree to indemnify and hold Seat Unique, its subsidiaries, affiliates, officers, agents and other partners and employees, harmless from any loss, liability, claim or demand, including reasonable solicitors' fees, made by any third party due to or arising out of your use of the Site, including also your use of the Site to provide a link to another site or to upload content or other information to the Site. \u003c/span\u003e\u003c/p\u003e \u003cp style=\"line-height: 1.295; margin-top: 0pt; margin-bottom: 8pt;\"\u003e\u003cspan style=\"font-size: 18px; line-height: 1.2; color: rgb(0, 0, 0);\"\u003eJuly 2023\u003c/span\u003e\u003c/p\u003e37:T15b2,\u003cdiv class=\"styles__Content-sc-9a6fcfe2-0 bYLHsk\"\u003e\u003ch1 style=\"margin-top: 0;\"\u003eCookie Policy\u003c/h1\u003e\r\n\u003cp\u003eThis cookie policy explains how RMS Events Ltd t/a Seat Unique (“Seat Unique”, “we”, “us” or “our”) use cookies and other similar technologies on our website https://www.seatunique.com (the “website”) to recognise you when you visit the website and in the course of using any of our services. It explains what these technologies are and why we use them, as well as yours to control our use of them.\u003c/p\u003e\r\n\u003cp\u003eWe use cookies on our website in various ways, including to make the website work and to analyse traffic.\u003c/p\u003e\r\n\u003ch3 class=\"doc-header\" id=\"introduction\"\u003eWhat are cookies?\u003c/h3\u003e\r\n\u003cp\u003eA web browser cookie is a small text file that websites place on your computer or your mobile device’s web browser. Cookies store information about the content you view and interact with, in order to remember your preferences and settings or to analyse how you use online services.\u003c/p\u003e\r\n\u003cp\u003eWeb browser cookies may store information such as your IP address of another identifier, your browser type, and information about the content you view and interact with on digital services. This is how cookies remember your preferences and settings and are able to analyse how you use the.\u003c/p\u003e\r\n\u003cp\u003eCookies set by Seat Unique are called “first-party cookies”. Cookies set by parties other than use are called “third-party cookies”. Third-party cookies enable third party features or functionality to be provided on or through the website. The parties that set these third-party cookies can recognise your computer both when it visits the website and also when it visits certain other websites.\u003c/p\u003e\r\n\u003cp\u003eIn addition to the use of cookies, we also use tracking technologies that are very similar. Our website and e-mails may contain small transparent image files or lines of code that record how you interact with them which are used to recognise your device type, track which website brought you to Seat Unique and to power interactive features on our website. These tracking technologies are also referred to as ‘cookies’ in this policy.\u003c/p\u003e\r\n\u003cp\u003eFor more information on cookies, please go to allaboutcookies.org.\u003c/p\u003e\r\n\u003ch3 class=\"doc-header\" id=\"cookie-types\"\u003eWhat type of cookies do we use?\u003c/h3\u003e\r\n\u003cp\u003eOur cookies are categorised below to identify whether these cookies are required for the correct operation of the website or whether they are used for functional purposes only (and are therefore not mandatory).\u003c/p\u003e\r\n\u003cstyle type=\"text/css\"\u003e\r\n.tg  {border-collapse:collapse;border-spacing:0;}\r\n.tg td{border-color:black;border-style:solid;border-width:1px;\r\n  overflow:hidden;padding:10px;word-break:normal;}\r\n.tg th{border-color:black;border-style:solid;border-width:1px;\r\n  font-weight:normal;overflow:hidden;padding:10px;word-break:normal;}\r\n.tg .tg-dvpl{text-align:left;vertical-align:top;}\r\n.tg .tg-0pky{text-align:left;vertical-align:top;}\r\n\u003c/style\u003e\r\n\u003ctable class=\"tg\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth class=\"tg-dvpl\"\u003eCategory\u003c/th\u003e\u003cth class=\"tg-0pky\"\u003eDescription\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"tg-0pky\"\u003eStrictly Necessary\u003c/td\u003e\u003ctd class=\"tg-0pky\"\u003eStrictly necessary cookies are those which are essential to enable you to navigate around our website and to use our services.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd class=\"tg-0pky\"\u003eFunctional\u003c/td\u003e\u003ctd class=\"tg-0pky\"\u003eFunctional cookies allow our website to remember the choices you make and any customisations you make to pages during your visit (such as filling in address details before purchasing a ticket). They are necessary to provide certain features and services specific to each individual fan.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd class=\"tg-0pky\"\u003eAnalytical\u003c/td\u003e\u003ctd class=\"tg-0pky\"\u003eThese cookies measure and track how you use our website so that we can continue to improve our website and the services we deliver to fans. The information we gather through these cookies can include web pages you have viewed, which pages you have entered and left from, your device type and platform type, which e-mails you have opened and acted upon and date and time stamp information.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\r\n\u003ch3 class=\"doc-header\" id=\"cookie-control\"\u003eHow you can control your cookie settings\u003c/h3\u003e\r\n\u003cp\u003eMost web browsers allow some control of most cookies through the browser settings. To find out more about cookies, including how to see what cookies have been set, please visit https://allaboutcookies.org.\u003c/p\u003e\r\n\u003cp\u003eFind out how to manage cookies on popular browsers:\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e\u003cp\u003eGoogle Chrome\u003c/p\u003e\u003c/li\u003e\r\n\u003cli\u003e\u003cp\u003eMicrosoft Edge\u003c/p\u003e\u003c/li\u003e\r\n\u003cli\u003e\u003cp\u003eMozilla Firefox\u003c/p\u003e\u003c/li\u003e\r\n\u003cli\u003e\u003cp\u003eMicrosoft Internet Explorer\u003c/p\u003e\u003c/li\u003e\r\n\u003cli\u003e\u003cp\u003eOpera\u003c/p\u003e\u003c/li\u003e\r\n\u003cli\u003e\u003cp\u003eApple Safari\u003c/p\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eTo find information relating to other browsers, visit the browser developer's website.\u003c/p\u003e\r\n\u003cp\u003eTo opt out of being tracked by Google Analytics across all websites, visit  https://tools.google.com/dlpage/gaoptout.\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003ePlease note:\u003c/strong\u003e If you choose to block certain functional cookies, you may not be able to use some features of our services.\u003c/p\u003e\r\n\u003ch3 class=\"doc-header\" id=\"cookie-contact\"\u003eHow to contact us\u003c/h3\u003e\r\n\u003cp\u003eIf you have any questions about this cookie statement, please send an email to help@seatunique.com  using the e-mail reference \u003cstrong\u003e“privacy notice request”\u003c/strong\u003e.\u003c/p\u003e\r\n\u003cp\u003eOur cookie statement may be updated from time to time and we recommend that you visit this page regularly to stay up to date with any other (less substantial or relevant) updates.\u003c/p\u003e\u003cstyle\u003eh3.doc-header { scroll-margin-top: 150px; }\u003c/style\u003e\u003c/div\u003e38:T217c,\u003cp\u003eExperience Formula 1 from a premium setting with official hospitality and VIP tickets through Seat Unique. Whether you are booking a Grand Prix later in 2026 or planning ahead for 2027, you can explore live availability at leading circuits around the world.\u003c/p\u003e\r\n\u003cp\u003eChoose your preferred destination, compare the available packages and book securely online. Each event page sets out the relevant season, circuit, date, seating and hospitality inclusions, helping you select the right experience with confidence.\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eBrowse Formula 1 hospitality and secure your place at a Grand Prix.\u003c/strong\u003e\u003c/p\u003e\r\n\u003ch2\u003eFormula 1 overview\u003c/h2\u003e\r\n\u003cp\u003e\u003cstrong\u003eChampionship:\u003c/strong\u003e FIA Formula One World Championship\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eFounded:\u003c/strong\u003e 1950\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eVenues:\u003c/strong\u003e Multiple permanent, temporary and street circuits worldwide\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eCapacity:\u003c/strong\u003e Varies considerably by circuit and event configuration\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eAddress:\u003c/strong\u003e Check the individual Grand Prix event page for the correct circuit address\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eDress code:\u003c/strong\u003e Determined by the circuit, hospitality facility and package\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eAudience:\u003c/strong\u003e Suitable for motorsport fans, families, friends, groups and corporate guests, subject to event-specific age restrictions\u003c/p\u003e\r\n\u003cp\u003eFormula 1 is the highest level of international  motor racing. The championship visits established circuits, city-centre street tracks and modern purpose-built venues across Europe, Asia-Pacific, the Americas and the Middle East.\u003c/p\u003e\r\n\u003cp\u003eEvery circuit offers a different experience. You could watch cars race through the streets of Monaco, see them tackle the sweeping corners of Silverstone or Spa-Francorchamps, or enjoy a night race beneath the lights in Singapore, Las Vegas or Abu Dhabi.\u003c/p\u003e\r\n\u003ch2\u003eFormula 1 hospitality and VIP tickets\u003c/h2\u003e\r\n\u003cp\u003eFormula 1 hospitality gives you the opportunity to enjoy a Grand Prix from a more comfortable and carefully managed environment. Packages range from premium reserved seating to trackside lounges, official Formula 1 hospitality and selected team experiences.\u003c/p\u003e\r\n\u003cp\u003eDepending on the race and package you choose, your experience may include:\u003c/p\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003e\u003cstrong\u003ePremium viewing:\u003c/strong\u003e Reserved grandstand seating, private terraces or trackside views\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eHospitality access:\u003c/strong\u003e Entry to a lounge, suite or dedicated guest facility\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eFood and drink:\u003c/strong\u003e Breakfast, lunch, snacks, refreshments or an inclusive bar\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eMulti-day admission:\u003c/strong\u003e Access on one, two or three days of the Grand Prix weekend\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eInsider experiences:\u003c/strong\u003e Selected packages may include pit lane walks, guided track tours or guest appearances\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eGuest services:\u003c/strong\u003e Hosts, event staff and dedicated hospitality facilities\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eSouvenirs:\u003c/strong\u003e Programmes, lanyards, gifts or branded merchandise with selected packages\u003c/li\u003e\r\n  \u003cli\u003e\u003cstrong\u003eCorporate options:\u003c/strong\u003e Packages suitable for client entertainment, incentives and group occasions\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eThese are examples rather than standard inclusions. Formula 1 packages vary significantly between circuits, hospitality facilities and ticket categories. Always read the individual event and package description before booking.\u003c/p\u003e\r\n\u003ch2\u003eWhen do Formula 1 tickets go on sale?\u003c/h2\u003e\r\n\u003cp\u003eHospitality and premium tickets are available for a range of upcoming 2026 races, while selected 2027 event pages and packages are also becoming available. Some 2027 listings may initially show a date as TBC or offer a limited selection while the event schedule and remaining hospitality options are finalised.\u003c/p\u003e\r\n\u003cp\u003eFurther packages may be added in stages. Checking Seat Unique regularly will help you see the latest availability, newly released experiences and current prices.\u003c/p\u003e\r\n\u003ch2\u003eHow to book Formula 1 hospitality\u003c/h2\u003e\r\n\u003col\u003e\r\n  \u003cli\u003eBrowse the live Formula 1 events listed on Seat Unique.\u003c/li\u003e\r\n  \u003cli\u003eChoose the Grand Prix you want to attend.\u003c/li\u003e\r\n  \u003cli\u003eReview the available  hospitality packages.\u003c/li\u003e\r\n  \u003cli\u003eComplete your booking securely online.\u003c/li\u003e\r\n  \u003cli\u003eReceive your booking confirmation and follow the instructions provided to access your tickets, which may be issued closer to the event.\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003ch2\u003eWhere does Formula 1 race?\u003c/h2\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eAlbert Park Circuit, Melbourne, Australia\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/c6ba783f#5439df67\"\u003eShanghai International Circuit, Shanghai, China\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/41ccc3bd#952dac00\"\u003eSuzuka International Racing Course, Suzuka, Japan\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/9d0e25d2#ebce67c5\"\u003eBahrain International Circuit, Sakhir, Bahrain\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/02dd28ad#f556d24d\"\u003eJeddah Corniche Circuit, Jeddah, Saudi Arabia\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/7a786d01#9bc3a532\"\u003eMiami International Autodrome, Miami, United States\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e ormula-1-tickets/0bdb6259#f0bb6e97\"\u003eBaku City Circuit, Baku, Azerbaijan\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/fce5b678#1da43422\"\u003eMarina Bay Street Circuit, Singapore, Singapore\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/f8fcce0e#c2f2abe0\"\u003eCircuit of the Americas, Austin, United States\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/05f5ebc0#57e25486\"\u003eAutódromo Hermanos Rodríguez, Mexico City, Mexico\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/19d048d4#5852714b\"\u003eAutódromo José Carlos Pace (Interlagos), São Paulo, Brazil\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/fbe41161#97d57ee0\"\u003eLas Vegas Strip Circuit, Las Vegas, United States\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/23879112#1b3835ea\"\u003eLusail International Circuit, Lusail, Qatar\u003c/a\u003e\u003c/li\u003e\r\n  \u003cli\u003e\u003ca href=\"https://www.seatunique.com/sport-tickets/motorsport/formula-1-tickets/d9419f0c#1982e19f\"\u003eYas Marina Circuit, Abu Dhabi, United Arab Emirates\u003c/a\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003ch2\u003eWhat is new for Formula 1 in 2027?\u003c/h2\u003e\r\n\u003cp\u003eThe 2027 season will feature several important venue changes.\u003c/p\u003e\r\n\u003cp\u003eThe Portuguese Grand Prix will return at the Autódromo Internacional do Algarve in Portimão. The circuit previously hosted Formula 1 in 2020 and 2021 and is known for its significant elevation changes and technical layout.\u003c/p\u003e\r\n\u003cp\u003eThe Turkish Grand Prix will also return at Istanbul Park. The circuit is recognised for its demanding sequence of corners, including the long, multi-apex Turn Eight.\u003c/p\u003e39:Ta99,\u003ch2\u003eAbout Formula 1\u003c/h2\u003e\r\n\u003cp\u003e\u003cstrong\u003eYear founded:\u003c/strong\u003e 1950\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor honours:\u003c/strong\u003e Formula 1 Drivers’ World Championship and Formula 1 Constructors’ World Championship\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eNotable rivalries:\u003c/strong\u003e Team and driver rivalries change from season to season, with long-standing competition involving names such as Ferrari, McLaren, Mercedes and Red Bull\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eFamous drivers:\u003c/strong\u003e Juan Manuel Fangio, Jim Clark, Niki Lauda, Alain Prost, Ayrton Senna, Michael Schumacher, Lewis Hamilton and Max Verstappen\u003c/p\u003e\r\n\u003cp\u003eFormula 1 has developed from a predominantly European championship into a worldwide sporting series. Its identity is shaped by technical innovation, driver skill, team strategy and the contrasting demands of each circuit.\u003c/p\u003e\r\n\u003cp\u003eThe championship entered a new technical era in 2026, with revised power units, increased electrical energy, advanced sustainable fuel and active aerodynamic systems. Cadillac also joined the grid as Formula 1’s 11th team.\u003c/p\u003e\r\n\u003cp\u003eA Grand Prix can provide an excellent day out or full weekend for families, friends and motorsport supporters. Hospitality also offers companies a distinctive setting for recognising employees, building client relationships and bringing guests together.\u003c/p\u003e\r\n\u003ch2\u003eFormula 1 highlights\u003c/h2\u003e\r\n\u003cul\u003e\r\n  \u003cli\u003eThe Formula 1 World Championship has been contested since 1950.\u003c/li\u003e\r\n  \u003cli\u003eThe season brings together permanent circuits, temporary venues and street races.\u003c/li\u003e\r\n  \u003cli\u003eDrivers compete for the individual World Championship, while teams contest the Constructors’ Championship.\u003c/li\u003e\r\n  \u003cli\u003eFormula 1 introduced a major new generation of technical regulations in 2026.\u003c/li\u003e\r\n  \u003cli\u003eCadillac became the championship’s 11th team in 2026.\u003c/li\u003e\r\n  \u003cli\u003ePortugal and Türkiye are set to return to the Formula 1 calendar in 2027.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003ch2\u003eWhat are Formula 1 race weekends like?\u003c/h2\u003e\r\n\u003cp\u003eA Formula 1 weekend is about much more than the Grand Prix itself. Most events include practice sessions, qualifying, support races, entertainment and the main race. Selected rounds use a Sprint format, creating an additional competitive session during the weekend.\u003c/p\u003e\r\n\u003cp\u003eThe experience differs greatly by destination. Traditional circuits place you close to recognisable corners and long-established grandstands, while street races bring Formula 1 into the centre of major international cities.\u003c/p\u003e\r\n\u003cp\u003eHospitality gives you a comfortable base between sessions, which can be particularly valuable during a long day at the circuit. Depending on your package, you may be able to dine, meet other guests, follow live timing or watch parts of the action from a terrace or lounge.\u003c/p\u003e\r\n\u003ch2\u003e\u003cbr\u003e\u003c/h2\u003e2b:[\"$\",\"$L31\",null,{\"initialData\":{\"menu_items\":{\"culture\":[{\"position\":2,\"visible\":true,\"link\":\"https://www.seatunique.com/culture-tickets/horticulture/the-rhs-chelsea-flower-show-tickets\",\"display_name\":\"The RHS Chelsea Flower Show \"},{\"position\":3,\"visible\":true,\"link\":\"https://www.seatunique.com/culture-tickets/festival/chestertons-polo-in-the-park-tickets\",\"display_name\":\"Chestertons Polo In The Park\"},{\"position\":5,\"visible\":true,\"link\":\"https://www.seatunique.com/culture-tickets/comedy/ricky-ger ed?\"},\"explore_listing_header\":{\"placeholder\":\"Explore the {{listingName}} package\"},\"3d_view_header\":{\"text\":\"The view from the section\"},\"photo_gallery\":{\"text\":\"Photo Gallery\"},\"compare\":{\"select\":\"Select\",\"title\":\"Package comparison\",\"placeholder\":\"Select package\",\"inclusions\":\"Inclusions\",\"description\":\"More information\",\"seat_map\":\"Seating map\",\"gallery\":\"Gallery\",\"text\":\"Compare packages\",\"back_to_compare\":\"Back to compare\",\"sold_out\":\"Sold Out\",\"enquire_now\":\"Enquire now\",\"none\":\"None\",\"tap_hint\":\"Tap on an image to expand\"}},\"faq\":{\"main_faqs_questions_array\":[{\"text\":\"Who are Seat Unique?\"},{\"text\":\"What is included with a hospitality ticket?\"},{\"text\":\"When and how do I book hospitality tickets?\"},{\"text\":\"Is there a limit on how many hospitality tickets I can buy?\"},{\"text\":\"I have a large group I wish to book for, can I do this online?\"},{\"text\":\"How can I pay for hospitality tickets? What payment methods do you accept?\"},{\"text\":\"Are hospitality ticket prices inclusive of VAT?\"},{\"text\":\"How much are booking fees? Are booking fees charged per transaction or per ticket?\"},{\"text\":\"Why are there booking fees on my transaction?\"},{\"text\":\"Is delivery included in the price of a hospitality ticket?\"},{\"text\":\"How do I know if my booking has been confirmed?\"},{\"text\":\"When will I receive my tickets?\"},{\"text\":\"Where/how can I find the hospitality itinerary for the event I’m attending?\"},{\"text\":\"Where/how can I find out where my seats are?\"},{\"text\":\"Are there age restrictions at any events? Are children welcome?\"},{\"text\":\"The event I'm attending has been cancelled/postponed. Will I receive a refund for my hospitality ticket/s?\"},{\"text\":\"My event has been cancelled/postponed, do I need to return my hospitality ticket/s?\"},{\"text\":\"I am disabled/am attending an event with someone who is disabled, how do I ensure I've booked the right hospitality tickets for disabled access?\"},{\"text\":\"When can I expect to receive hospitality tickets for an overseas address?\"},{\"text\":\"I haven't received my hospitality tickets. How can I track them?\"},{\"text\":\"My hospitality tickets are at the Box Office - how do I collect them?\"},{\"text\":\"Lost/stolen bank card - how do I collect my hospitality tickets?\"},{\"text\":\"Can someone else pick up my hospitality tickets from the Box Office collection?\"},{\"text\":\"I have had a fantastic time at the event, how do I say thank you?\"},{\"text\":\"Is Seat Unique legitimate?\"}],\"main_faqs_answers_array\":[{\"text\":\"Seat Unique is a secure platform that offers official online access to premium tickets and hospitality packages for live music, sport and culture events.\\\\n\\\\nThrough valued partnerships, we are proud to exhibit products exclusively from official sources. This ensures that our customers are able to purchase guaranteed access to their favourite events; anytime, anywhere.\"},{\"text\":\"Hospitality ticket details and specific inclusions are displayed on our website pre-checkout. If you have any questions regarding these, please contact our dedicated team on phone \u003ca href=\\\"tel:+44(0)2087060164\\\"\u003e+44 (0)208 706 0164\u003c/a\u003e or email \u003ca href=\\\"mailto:enquiries@seatunique.com\\\"\u003eenquiries@seatunique.com\u003c/a\u003e.\"},{\"text\":\"Hospitality tickets are available to book directly online. However, the availability of some hospitality tickets may need to be checked with a member of our team before your booking can be processed. Please contact us via the website, phone or email if this is the case.\"},{\"text\":\"All hospitality tickets are subject to availability.\"},{\"text\":\"Yes, however, all hospitality tickets are subject to availability. If there isn't availability for the total number of hospitality tickets you need online, then you can contact a member of our dedicated team, who can assist you with your booking.\"},{\"text\":\"We accept all major credit and debit cards. We also accept payments from Google Pay and Apple Pay.\"},{\"text\":\"All prices for hospitality and private box tickets purchased via Seat Unique are exclusive of VAT and fees. VAT and fees will be added on at checkout.\"},{\"text\":\"Booking fees are priced at 5% of the total booking value (please note this can change dependent on supplier). This is charged per transaction, not per hospitality ticket purchased.\"},{\"text\":\"Seat Unique’s fee covers website maintenance and payment charges. This enables us to keep improving our website to ensure that you get the best possible buying experience.\"},{\"text\":\"The delivery fee is added on to the overall hospitality ticket price during checkout.\"},{\"text\":\"Once payment has been accepted, you will receive an email confirming your booking. If you do not receive the confirmation email, or you have a query around your booking, please contact us on phone or email.\"},{\"text\":\"We aim to deliver all hospitality tickets at least 10 days before the event. If it is the case that tickets are purchased within this timeframe then tickets may be left for collection at the venue or if there is suitable time, they will be delivered to the original address as soon as possible.\"},{\"text\":\"In the run up to the event, a member of our customer service team will be in touch via email with the itinerary and running order of your event.\\\\n\\\\nIf you have any queries about your event before this period, you can email us at \u003ca href=\\\"mailto:enquiries@seatunique.com\\\"\u003eenquiries@seatunique.com\u003c/a\u003e or call us on \u003ca href=\\\"tel:+44(0)2087060164\\\"\u003e+44 (0)208 706 0164\u003c/a\u003e.\"},{\"text\":\"You will be able to find your seat location, pre-purchase on our listing page under hospitality ticket inclusions. A member of our customer service team will also contact you via email with your exact seat location.\"},{\"text\":\"While most hospitality suites welcome children accompanied by adults, we recommend checking with the venue directly before purchasing a ticket for anyone under the age of 18.\"},{\"text\":\"If an event is cancelled, a refund for the total number of hospitality tickets purchased will be issued to the original buyer via the original payment method. Refunds will not be issued for postponed events.\"},{\"text\":\"If the event you're attending has been cancelled, your hospitality ticket/s will automatically become void. This means you will not be required to return your hospitality ticket/s.\"},{\"text\":\"For disabled access hospitality tickets, please contact a member of our customer service team on \u003ca href=\\\"mailto:enquiries@seatunique.com\\\"\u003eenquiries@seatunique.com\u003c/a\u003e or \u003ca href=\\\"tel:+44(0)2087060164\\\"\u003e+44 (0)208 706 0164\u003c/a\u003e. A member of the team will be able to ensure you book the right hospitality suite to suit you and your guests needs.\"},{\"text\":\"As a general rule, we only post to UK postcodes. This is because very often tickets go missing when posting overseas. If you have booked using an overseas address, then tickets will be left for collection on the day. You will require ID to collect your tickets. Full collection details will be emailed to you approx 1-2 weeks prior to the event.\"},{\"text\":\"Once your hospitality tickets have been dispatched, we will send your Royal Mail special delivery tracking number via email.\"},{\"text\":\"Before the event, we will send you an email with a detailed map of the precise location of the Box Office.\"},{\"text\":\"Typically Box Office collections only require photographic ID of the lead booker. However, if the venue asks for a bank card as proof of purchase, please call our customer service team in advance.\"},{\"text\":\"All Box Office hospitality tickets must be collected under the name they are left under.\"},{\"text\":\"We value customer feedback and would love to hear about your experience with us, from booking right through to the main event. Please leave your review of Seat Unique on our \u003ca href=\\\"https://uk.trustpilot.com/review/seatunique.com\\\" target=\\\"_blank\\\" rel=\\\"noreferrer noopener\\\"\u003eTrustpilot\u003c/a\u003e or \u003ca href=\\\"https://www.google.co.uk/search?source=hp\u0026ei=xpgUXpKrA4awUoKAsJgH\u0026q=seat+unique\u0026oq=seat+unique\u0026gs_l=psy-ab.3..0l4j0i22i30l6.95.1167..1385...0.0..0.252.1161.9j0j2......0....1..gws-wiz.......0i131j0i10.xTXHRbu-J-g\u0026ved=0ahUKEwiSppDB3PHmAhUGmBQKHQIADHMQ4dUDCAc\u0026uact=5\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eGoogle Business page\u003c/a\u003e.\"},{\"text\":\"Yes, Seat Unique is a legitimate premium ticketing marketplace where fans can purchase official premium tickets and hospitality packages for live events.\\\\n\\\\n We work officially with clubs, venues, artists and rightsholders to ensure that all tickets and packages available on our platform come with 100% guaranteed entry to an event.\\\\n\\\\n We use secure online payment methods to make sure that all transactions made through our platform are safe.\"}]},\"listing\":{\"per_ticket\":{\"text\":\"per ticket\"},\"box_of_n_guests\":{\"text\":\"Box for {{range}} guests\"},\"box_of_n_tooltip\":{\"placeholder\":\"Package can be purchased for between {{minBoundary}} - {{maxBoundary}} guests.\"}},\"ticket_types\":{\"mobile\":{\"label_one\":\"Mobile ticket\",\"label_other\":\"Mobile tickets\"},\"e_ticket\":{\"label_one\":\"E-ticket\",\"label_other\":\"E-tickets\"},\"physical\":{\"label_one\":\"Physical ticket\",\"label_other\":\"Physical tickets\"},\"physical_description\":{\"text\":\"Your tickets \u003cb\u003ewill be sent to you via post\u003c/b\u003e no longer than 2-4 days prior to the event date.\"},\"e_ticket_description\":{\"text\":\"Your e-tickets \u003cb\u003ewill be emailed\u003c/b\u003e to you no longer than 2-4 days prior to the event date.\"},\"mobile Board Advisor\"},\"clive_woodward_header\":{\"text\":\"Make it official with Seat Unique\"},\"clive_woodward_content\":{\"text\":\"A breath of fresh air in the world of events. Seat Unique are providing a real solution to a real problem, giving access to official hospitality and VIP tickets on their platform.\"},\"sam_warburton_role\":{\"text\":\"Seat Unique Brand Ambassador\"},\"sam_warburton_header\":{\"text\":\"The leading provider of premium tickets and experiences\"},\"sam_warburton_content\":{\"text\":\"By seamlessly blending technology and addressing the key challenges of accessing tickets, Seat Unique provides access to unforgettable experiences for fans and unrivalled revenue opportunities for rightsholders. I am delighted to be joining Seat Unique in their exciting journey.\"},\"lauren_bell_role\":{\"text\":\"Seat Unique Brand Ambassador\"},\"george_north_role\":{\"text\":\"Seat Unique Brand Ambassador\"},\"george_north_content\":{\"text\":\"Seat Unique understands that fans hold the power to creating extraordinary memories at live events. That’s why they are committed to transforming the premium ticketing space.\"},\"lauren_bell_content\":{\"text\":\"Seat Unique makes premium experiences at events accessible to all. Because fans shouldn’t settle for a once-in-a-lifetime experience; they deserve to relive those moments again and again.\"},\"lauren_bell_header\":{\"text\":\"Seat Unique is redefining premium ticketing and experiences for fans\"},\"george_north_header\":{\"text\":\"Seat Unique is pioneering a revolution in the ticketing and hospitality industry\"},\"stuart_broad_content\":{\"text\":\"Seat Unique's approach to making premium experiences accessible to all fans is unparalleled, and I am excited to be part of a movement that will bring fans closer to the game they love.\"},\"stuart_broad_header\":{\"text\":\"Seat Unique is leading the way in making premium experiences accessible to all fans\"},\"stuart_broad_role\":{\"text\":\"Seat Unique Brand Ambassador\"},\"page_title\":{\"text\":\"Hospitality \u0026 VIP Tickets For Sports, Music \u0026 Live Events\"},\"page_description\":{\"text\":\"Buy official hospitality packages and VIP tickets to live sport, music and culture events. Official premium access to live events with Seat Unique.\"},\"matt_dawson_header\":{\"text\":\"I’ve really enjoyed being involved with Seat Unique so far. I love the business, and this role feels like the perfect fit for my network and skill set.\"},\"matt_dawson_content\":{\"text\":\"There is no better time to be joining, as fans are increasingly demanding more from live sports. They are craving exclusive access and unmatched premium experiences at the world’s top events - and Seat Unique delivers on that better than anybody else in the industry.\"},\"matt_dawson_role\":{\"text\":\"Business Advisor\"},\"harry_kane_content\":{\"text\":\"Throughout my career and in my personal life, I’ve seen the power of live events to inspire, unite, and create lasting memories. As an athlete, I know how much it means to fans to have those incredible experiences. Seat Unique is changing how people access these moments by creating better access to premium experiences, and I’m excited to be a part of their team.\"},\"harry_kane_role\":{\"text\":\"Seat Unique Shareholder\"},\"other_events\":\"Other events you might be interested in\",\"jack_whitehall_content\":{\"text\":\"Nothing beats the buzz of a live crowd, whether that’s at a gig, a match, or one of my own shows. What I love about Seat Unique is that we share the same goal: making incredible live experiences more accessible to everyone. Fans are craving elevated, once-in-a-lifetime moments more than ever, and Seat Unique makes it easier to experience them.\"},\"jack_whitehall_role\":{\"text\":\"Seat Unique Shareholder\"}},\"event\":{\"multiple_venues\":{\"text\":\"Multiple venues\"}},\"listings\":{\"on_sale_now\":{\"text\":\"On sale now\"}},\"search\":{\"homepage\":{\"placeholder\":\"Search for artists, teams, venues or locations\",\"cta\":\"Search\",\"new_placeholder\":\"Artists, events, venues and more...\"},\"date\":{\"placeholder\":\"Any date\"}},\"filter\":{\"label\":\"Popular events\",\"option\":{\"anywhere\":\"anywhere\",\"near_me\":\"near me\",\"Spain\":\"Spain\",\"Birmingham\":\"Birmingham\",\"Manchester\":\"Manchester\",\"Leeds\":\"Leeds\",\"London\":\"London\",\"Edinburgh\":\"Edinburgh\",\"Cardiff, Wales\":\"Cardiff\",\"all\":\"All locations\",\"Warsaw\":\"Warsaw\"},\"errors\":{\"usupported\":\"Geolocation not supported\",\"denied\":\"We need to access your location in order to show you events nearby.\",\"unavalaible\":\"Location is not available. Please select location manually.\",\"default\":\"Error determining location.\"}}},\"f2f_page\":{\"f2f_tickets\":{\"page_title\":{\"text\":\"Seat Unique – Events of {{name}}\"},\"sell_your_tickets\":{\"text\":\"Sell your Welsh Rugby tickets now\"},\"tickets_are_live\":{\"text\":\"Your tickets are now live\"},\"steps_verification\":{\"text\":\"Ticket verification\"},\"steps_details\":{\"text\":\"Specify details\"},\"steps_add_payment_details\":{\"text\":\"Add price and payment details\"},\"steps_confirm\":{\"text\":\"Confirm\"},\"steps_mobile_tickets\":{\"text\":\"1. Your tickets\"},\"steps_mobile_details\":{\"text\":\"2. Specify your details\"},\"steps_mobile_payment_details\":{\"text\":\"3. Add price and payment details\"},\"steps_mobile_confirm\":{\"text\":\"4. Confirm your listing\"},\"search_for_event_to_sell_tickets\":{\"text\":\"Search for the event you want to sell tickets to\"},\"wru_events\":{\"label\":\"Welsh Rugby Events\"}},\"checkout\":{\"wru_charitable_trust\":{\"text\":\"Welsh Rugby Charitable Trust\"},\"royal_british_legion\":{\"text\":\"Royal British Legion Industries\"}},\"f2f_my_account\":{\"page_title\":{\"text\":\"Personal Information\"},\"my_info\":{\"label\":\"My personal information\"},\"my_info_description\":{\"label\":\"Provide your details and how we can contact you. Please ensure
